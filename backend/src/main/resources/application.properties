# =====================================================================
# Sentinel SOC Security Log Analyzer — Application Configuration
# =====================================================================

# Server Configuration
server.port=8080
server.host=0.0.0.0
server.api.prefix=/api/v1
server.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# MySQL 8.0 JDBC DataSource Configuration
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/sentinel_soc?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=soc_app_user
db.password=soc_secure_password_2026

# HikariCP Connection Pool Settings
db.pool.maximum-pool-size=10
db.pool.minimum-idle=2
db.pool.idle-timeout-ms=30000
db.pool.connection-timeout-ms=20000
db.pool.max-lifetime-ms=1800000

# Security Engine Heuristics Default Thresholds
rules.bruteforce.threshold=5
rules.bruteforce.window.seconds=60
rules.rate-limit.threshold=20
rules.rate-limit.window.seconds=10
